# `docker compose up` runs the whole stack: Postgres → migrate+seed → API → web.
# Every value has a local-demo default so it works without a .env file;
# copy .env.example to .env to override. None of these defaults are used in
# the public deployment.

x-api-environment: &api-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: 4000
  DATABASE_URL: postgres://${POSTGRES_USER:-teslapool}:${POSTGRES_PASSWORD:-teslapool}@db:5432/${POSTGRES_DB:-teslapool}
  JWT_SECRET: ${JWT_SECRET:-local-docker-demo-secret-not-for-production}
  JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-12}
  # Plain http on localhost, so the cookie cannot be Secure here.
  COOKIE_SECURE: 'false'
  # The API sits behind the web container's /api proxy.
  TRUST_PROXY_HOPS: 1
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-TeslaPool@2026}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teslapool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teslapool}
      POSTGRES_DB: ${POSTGRES_DB:-teslapool}
    ports:
      # 5433 on the host so it does not clash with a locally installed Postgres.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations, then the idempotent seed, then exits.
  migrate:
    image: dhaka-tesla-pool-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['sh', '-c', 'node dist/migrate.js && node dist/seed.js']
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: dhaka-tesla-pool-api
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Not published to the host: browsers reach it through web's /api proxy.
    expose:
      - '4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/v1/health > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  web:
    image: dhaka-tesla-pool-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

volumes:
  pgdata:
