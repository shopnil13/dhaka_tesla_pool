services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teslapool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teslapool}
      POSTGRES_DB: ${POSTGRES_DB:-teslapool}
    ports:
      # 5433 on the host so it does not clash with a locally installed Postgres.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
